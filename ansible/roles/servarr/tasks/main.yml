---
- name: Create *arr storage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0775"
  with_items:
    - "{{ media_dir }}"
    - "{{ servarr_sonarr_dir }}/config"
    - "{{ servarr_prowlarr_dir }}/config"

- name: Create torrent client network
  community.general.docker_network:
    name: torrent_client_network

# - name: Add connection to transmission container
#   community.general.xml:
#     path: {{}}

- name: Create Sonarr container
  community.general.docker_container:
    name: sonarr-app
    image: linuxserver/sonarr:4.0.20@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9
    pull: true
    image_name_mismatch: recreate
    networks:
      - name: torrent_client_network
        aliases:
          - sonarr
    network_mode: default
    ports:
      - "8989"
    volumes:
      - "{{ servarr_sonarr_dir }}/config:/config"
      - "{{ media_dir }}:/data"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Dublin"
    container_default_behavior: compatibility
    restart_policy: always
    labels:
      traefik.enable: "true"
      traefik.http.routers.sonarr.rule: "Host(`sonarr.{{ homelab_domain }}`)"
      traefik.http.routers.sonarr.entrypoints: "websecure"
      traefik.http.routers.sonarr.tls: "true"
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"

- name: Create Prowlarr container
  community.general.docker_container:
    name: prowlarr-app
    image: linuxserver/prowlarr:2.6.6-develop@sha256:e95fafe9edac0dc687b17e7c18f38722968e086a0ff59fc5f18eba28648dd51a
    pull: true
    image_name_mismatch: recreate
    networks:
      - name: torrent_client_network
        aliases:
          - prowlarr
    network_mode: default
    ports:
      - "9696"
    volumes:
      - "{{ servarr_prowlarr_dir }}/config:/config"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Dublin"
    container_default_behavior: compatibility
    restart_policy: always
    labels:
      traefik.enable: "true"
      traefik.http.routers.prowlarr.rule: "Host(`prowlarr.{{ homelab_domain }}`)"
      traefik.http.routers.prowlarr.entrypoints: "websecure"
      traefik.http.routers.prowlarr.tls: "true"
      traefik.http.services.prowlarr.loadbalancer.server.port: "9696"
