---
- name: Set up netbox data directory
  ansible.builtin.file:
    path: "{{ netbox_dir }}/app/media"
    state: directory
    owner: root
    mode: "0775"
  become: true

- name: Set up netbox database directory
  ansible.builtin.file:
    path: "{{ netbox_dir }}/db"
    state: directory
    owner: 70
    mode: "0700"
  become: true

- name: Set up netbox redis directory
  ansible.builtin.file:
    path: "{{ netbox_dir }}/redis"
    state: directory
    owner: 999
    mode: "0775"
  become: true

- name: Set up netbox redis cache directory
  ansible.builtin.file:
    path: "{{ netbox_dir }}/redis-cache"
    state: directory
    owner: 999
    mode: "0775"
  become: true

- name: Create netbox shared network
  community.general.docker_network:
    name: netbox_network

- name: Netbox - Postgres DB container
  community.general.docker_container:
    name: netbox-postgres
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    pull: true
    image_name_mismatch: recreate
    networks:
      - name: netbox_network
        aliases:
          - postgres
    network_mode: default
    volumes:
      - "{{ netbox_dir }}/db:/data"
    env:
      POSTGRES_USER: "{{ netbox_db_user }}"
      POSTGRES_PASSWORD: "{{ netbox_db_pass }}"
      PGDATA: "/data"
    restart_policy: unless-stopped
    container_default_behavior: compatibility

- name: Netbox - Redis container
  community.general.docker_container:
    name: netbox-redis
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    pull: true
    image_name_mismatch: recreate
    networks:
      - name: netbox_network
        aliases:
          - redis
    network_mode: default
    volumes:
      - "{{ netbox_dir }}/redis:/data"
    command: "redis-server --appendonly yes"
    restart_policy: always
    container_default_behavior: compatibility

- name: Netbox - Redis cache container
  community.general.docker_container:
    name: netbox-redis-cache
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    pull: true
    image_name_mismatch: recreate
    networks:
      - name: netbox_network
        aliases:
          - redis-cache
    network_mode: default
    volumes:
      - "{{ netbox_dir }}/redis-cache:/data"
    restart_policy: always
    container_default_behavior: compatibility

# TODO: change logging level to be less verbose
- name: Netbox - App container
  community.general.docker_container:
    name: netbox-app
    image: netboxcommunity/netbox:v4.7.2-5.1.1@sha256:ad038bdb0e3498e5bf81c2c8becf396d62cbdc118d0b491b4d58014968033066
    pull: true
    image_name_mismatch: recreate
    ports:
      - "8080"
    networks:
      - name: netbox_network
    network_mode: default
    volumes:
      # default configuration scripts are included with dockerfile
      # see https://github.com/netbox-community/netbox-docker/blob/release/docker-compose.yml
      # for details of the folders, should any of the files need modifying.
      - "{{ netbox_dir }}/app/media:/opt/netbox/netbox/media"
    env: "{{ netbox_container_env }}"
    restart_policy: unless-stopped
    container_default_behavior: compatibility
    labels:
      traefik.enable: "true"
      traefik.http.routers.netbox.rule: "Host(`netbox.{{ homelab_domain }}`)"
      traefik.http.routers.netbox.entrypoints: "websecure"
      traefik.http.routers.netbox.tls: "true"
    healthcheck:
      start_period: 180s
      timeout: 3s
      interval: 15s
      test: "/opt/netbox/health.sh"

# Runs background jobs: scripts, reports, webhooks, bulk operations, and since
# NetBox 4.4 the housekeeping system job that replaced the housekeeping script.
- name: Netbox - Worker container
  community.general.docker_container:
    name: netbox-worker
    image: netboxcommunity/netbox:v4.7.2-5.1.1@sha256:ad038bdb0e3498e5bf81c2c8becf396d62cbdc118d0b491b4d58014968033066
    pull: true
    image_name_mismatch: recreate
    networks:
      - name: netbox_network
    network_mode: default
    volumes:
      - "{{ netbox_dir }}/app/media:/opt/netbox/netbox/media"
    env: "{{ netbox_container_env }}"
    restart_policy: unless-stopped
    container_default_behavior: compatibility
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      start_period: 20s
      timeout: 3s
      interval: 15s
      test: "ps -aux | grep -v grep | grep -q rqworker || exit 1"
