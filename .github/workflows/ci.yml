---

name: CI
'on':
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Install external roles & collections for ansible-lint
        run: ansible-galaxy install -r ansible/requirements.yml

      - name: Lint all ansible playbooks in repo
        run: |
          echo "$VAULT_PASSWORD" > .vault_pass.txt
          export ANSIBLE_VAULT_PASSWORD_FILE=".vault_pass.txt"
          ansible-lint
        env:
          VAULT_PASSWORD: ${{secrets.VAULT_PASSWORD}}

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint all yaml in repo
        run: yamllint .

  packer-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packer

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialise Packer
        run: packer init .

      - name: Validate Packer templates
        run: packer validate .

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - dev
          - prod

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: terraform

      # No Terraform Cloud token needed since we're using -backend=false
      - name: Initialise Terraform without a backend
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  # test:
  #   runs-on: ubuntu-latest
  #   steps:
