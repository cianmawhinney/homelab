---

name: Deploy

'on':
  push:
    branches:
      - master
    paths:
      - ansible/**
  workflow_dispatch:
  schedule:
    - cron: 0 6 * * *  # every day at 6am


jobs:
  # This is a bit of a hack - ideally deployments would happen using something like AWX, but this mostly works (kind of)
  deploy-prod:
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: ansible-deployment-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run playbook
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        with:
          playbook: main.yml
          directory: ./ansible
          key: ${{secrets.RUNNER_SSH_PRIVATE_KEY}}
          inventory: |
            [dockerhosts]
            139.59.190.200 ansible_user=root
          vault_password: ${{secrets.VAULT_PASSWORD}}
          requirements: requirements.yml
          options: |
            --verbose
